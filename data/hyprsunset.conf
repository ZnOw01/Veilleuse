# Automatic night-light schedule using the system's local timezone.

# Daylight: restore hyprsunset's actual natural color at 06:00.
# The UI keeps 6000 K as a nominal daylight reference only. It is not applied
# here, so this profile does not add a daytime color filter.
profile {
    time = 06:00
    identity = true
}

# Night light: warm display from 15:30 until the 06:00 profile takes over.
profile {
    time = 15:30
    temperature = 3500
}
