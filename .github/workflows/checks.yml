name: Quality checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt 6 test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            qt6-declarative-dev-tools qml6-module-qttest qml6-module-qtquick \
            qml6-module-qtquick-window qml6-module-qtqml-workerscript
          test -x /usr/lib/qt6/bin/qmltestrunner
      - name: Run quality gates
        run: |
          chmod +x scripts/check.sh scripts/check_hygiene.sh scripts/veilleuse-control
          ./scripts/check.sh
