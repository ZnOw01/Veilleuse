name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifest
        run: |
          python -m json.tool manifest.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("manifest.json").read_text())
          assert manifest["schemaVersion"] == 1
          assert manifest["id"] == "io.github.ZnOw01.veilleuse"
          assert manifest["kinds"] == ["bar-widget"]
          assert manifest["entryPoints"]["barWidget"] == "BarWidget.qml"
          assert Path("BarWidget.qml").is_file()
          assert Path("Panel.qml").is_file()
          assert Path("scripts/veilleuse-control").is_file()
          PY
      - name: Run model and helper tests
        run: |
          python -m unittest discover -s tests -p 'test_veilleuse_control.py'
          node --test tests/UiModel.test.js tests/model.test.mjs tests/layout.test.mjs
      - name: Check package hygiene
        run: |
          test -x scripts/veilleuse-control
          test -z "$(find . -path ./.git -prune -o -type d \( -name .venv -o -name dist -o -name build -o -name .pytest_cache \) -prune -o -type l -print -quit)"
          test -z "$(find . -path ./.git -prune -o -type d \( -name .venv -o -name dist -o -name build -o -name .pytest_cache \) -prune -o \( -name __pycache__ -o -name '*.pyc' \) -print -quit)"
          git show --check --oneline --format= HEAD
